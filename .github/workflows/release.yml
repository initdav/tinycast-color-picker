name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and release (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must match package.json version, for example v1.1.0.');
          }
          NODE

      - name: Install build dependencies
        run: npm ci --ignore-scripts

      - name: Check types
        run: npm run check

      - name: Build universal extension
        run: npm run build

      - name: Test compiled extension
        run: npm test

      - name: Package and verify release archive
        run: npm run package:release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > .build/release/notes.md <<'NOTES'
          Download **tinycast-color-picker.zip** below and unzip it. In TinyCast, open **Settings → Extensions → Install → Add from folder** and select the extracted **tinycast-color-picker** folder.

          Requires macOS 26 or newer. Supports Apple silicon and Intel. No Node.js, Xcode, or compilation needed.

          The "Source code" downloads are for developers. SHA256SUMS contains the checksum of the installable ZIP.
          NOTES

          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > .build/release/is-draft; then
            if [[ "$(cat .build/release/is-draft)" != true ]]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" .build/release/tinycast-color-picker.zip .build/release/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" \
              .build/release/tinycast-color-picker.zip .build/release/SHA256SUMS \
              --verify-tag --title "Color Picker $RELEASE_TAG" \
              --generate-notes --notes-file .build/release/notes.md
          fi
